</style></head><body><canvas id="game"></canvas><div id="rotate"><b>↻ 🐈</b>Поверни телефон горизонтально<br><small style="font-size:15px;margin-top:12px">Маленькое приключение ждёт тебя ♡</small></div><button id="sound" aria-label="Звук">♫</button><div id="controls"><button id="left" aria-label="Влево">←</button><button id="right" aria-label="Вправо">→</button><button id="action" aria-label="Действие">♡</button><button id="jump" aria-label="Прыжок">↑</button></div><div id="toast"></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),controls=document.querySelector('#controls'),toastEl=document.querySelector('#toast');const W=960,H=540;canvas.width=W;canvas.height=H;const names=['Домик и сад','Волшебный лес','Ручей и деревня','Последний домик'],backgrounds=['garden','forest','village','sunset'];const images={};for(const n of ['menu',...backgrounds,'letter','ending']){const i=new Image();i.src='assets/'+n+'.webp';images[n]=i}let mode='menu',stage=0,progress=0,flowers=0,helped=[false,false,false],frame=0,last=0,cam=0,vy=0,y=0,ground=410,dir=1,walk=0,pet=0,particles=[],mute=false,audio=null,interact=false,clicks=0;const held={left:false,right:false};const stageLengths=[1750,1700,1700,1400];let saved=0;try{saved=Number(localStorage.getItem('catdelivery-stage')||0)}catch(e){}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function message(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(message.timer);message.timer=setTimeout(()=>toastEl.classList.remove('show'),2800)}function audioNote(freq=520){if(mute)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.76,audio.currentTime+.14);g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.24);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.25)}catch(e){}}function setStage(n){stage=n;progress=95;cam=0;y=0;vy=0;mode='play';try{localStorage.setItem('catdelivery-stage',String(stage))}catch(e){}message(['Найди письмо и отправляйся в путь ♡','Помоги зайчику найти цветок 🌸','Птичка потеряла ленточку ♡','Осталось доставить письмо 💌'][stage]);audioNote(570)}function next(){if(stage<3){setStage(stage+1)}else{mode='letter';controls.style.display='none';audioNote(740)}}function p function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function text(t,x,y,size=24,color='#fff5e2',align='center',font='Georgia'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.shadowColor='#22110b99';ctx.shadowBlur=5;ctx.fillText(t,x,y);ctx.shadowBlur=0}function bg(name){const i=images[name];if(i.complete&&i.naturalWidth){ctx.drawImage(i,0,0,W,H)}else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#96bfc0');g.addColorStop(1,'#d5b57f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}function cat(x,z,scale=1){ctx.save();ctx.translate(x,z);ctx.scale(dir*scale,scale);const bob=(Math.abs(walk)>0?Math.sin(frame*.26)*3:Math.sin(frame*.055)*1.2);ctx.translate(0,bob);if(y===0){ctx.fillStyle='#2b281c66';ctx.beginPath();ctx.ellipse(0,12,43,9,0,0,7);ctx.fill()}ctx.strokeStyle='#bb693d';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-31,-36);ctx.bezierCurveTo(-62,-64,-45,-100,-22,-80);ctx.stroke();ctx.fillStyle='#fff0d8';ctx.beginPath();ctx.ellipse(-7,-29,39,27,-.06,0,7);ctx.fill();ctx.fillStyle='#dd8c51';ctx.beginPath();ctx.ellipse(-12,-34,38,25,-.05,0,7);ctx.fill();ctx.fillStyle='#f5d1a0';ctx.beginPath();ctx.ellipse(12,-23,22,16,0,0,7);ctx.fill();for(const a of [-27,5]){ctx.fillStyle='#f7d6b1';ctx.beginPath();ctx.ellipse(a,-7,9,12,0,0,7);ctx.fill()}ctx.fillStyle='#e6a269';ctx.beginPath();ctx.ellipse(23,-50,26,27,0,0,7);ctx.fill();for(const p of [[7,-78],[38,-79]]){ctx.fillStyle='#d67d4b';ctx.beginPath();ctx.moveTo(p[0]-11,p[1]+20);ctx.lineTo(p[0],p[1]-10);ctx.lineTo(p[0]+13,p[1]+17);ctx.fill();ctx.fillStyle='#f6a9a0';ctx.beginPath();ctx.moveTo(p[0]-4,p[1]+12);ctx.lineTo(p[0],p[1]-1);ctx.lineTo(p[0]+6,p[1]+11);ctx.fill()}ctx.fillStyle='#fff4df';ctx.beginPath();ctx.ellipse(31,-41,18,13,0,0,7);ctx.fill();ctx.fillStyle='#34281e';for(const ex of [18,40]){ctx.beginPath();ctx.ellipse(ex,-55,3.2,4.6,0,0,7);ctx.fill()}ctx.fillStyle='#dc777c';ctx.beginPath();ctx.moveTo(30,-43);ctx.lineTo(37,-43);ctx.lineTo(33,-39);ctx.fill();ctx.strokeStyle='#704334';ctx.lineWidth=1.4;for(const s of [-1,1])for(let j=0;j<2;j++){ctx.beginPath();ctx.moveTo(32,-39);ctx.lineTo(32+s*23,-39+j*6);ctx.stroke()}rounded(-30,-58,28,28,6,'#80533c','#e1b97d');ctx.strokeStyle='#efc893';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-29,-51);ctx.quadraticCurveTo(-16,-75,1,-51);ctx.stroke();if(pet>0){text('♡',0,-102+Math.sin(frame*.1)*7,29,'#ffe5e9')}ctx.restore()}
function update(dt){frame+=dt*60;pet=Math.max(0,pet-dt*60);if(mode!=='play')return;const move=(held.right?1:0)-(held.left?1:0);if(move){dir=move;progress=clamp(progress+move*210*dt,45,stageLengths[stage]-30);walk=move}else walk=0;vy+=30*dt;y+=vy*dt;if(y>0){y=0;vy=0}cam+=(clamp(progress-400,0,stageLengths[stage]-960)-cam)*Math.min(1,dt*3.8);if(progress>stageLengths[stage]-100){if(stage===0&&!helped[0]){progress=stageLengths[stage]-160;message('Сначала найди письмо у домика ♡')}else if(stage===1&&!helped[1]){progress=stageLengths[stage]-160;message('Зайчик ждёт помощи ♡')}else if(stage===2&&!helped[2]){progress=stageLengths[stage]-160;message('Помоги птичке найти ленточку ♡')}else next()}if(Math.random()<dt*13)particles.push({x:Math.random()*W,y:Math.random()*H,v:8+Math.random()*15,life:5+Math.random()*5,size:2+Math.random()*3});particles=particles.filter(p=>(p.y+=p.v*dt,p.x+=Math.sin(frame*.02+p.y)*dt*6,p.life-=dt,p.life>0))}
function render(){ctx.clearRect(0,0,W,H);if(mode==='menu'){bg('menu');ctx.fillStyle='#17252240';ctx.fillRect(0,0,W,H);rounded(520,165,370,255,22,'#231d19b8','#f8dfb366');text('Cat Delivery',705,228,53);text('A Little Letter ♡',705,268,23);rounded(584,307,240,58,13,'#f6e1b9','#fdf6dc');text('Начать путешествие',704,345,23,'#513b2e');text('Нажми на экран',705,398,18);controls.style.display='none';return}if(mode==='letter'){bg('letter');rounded(178,55,604,430,22,'#fff1d9f0','#bd956e');text('Моё письмо для тебя 💌',480,121,32,'#714b39');text('Этот маленький котик прошёл целый мир,',480,185,22,'#684637');text('чтобы принести тебе кое-что от меня.',480,220,22,'#684637');text('Надеюсь, его путешествие',480,276,22,'#684637');text('подарило тебе улыбку.',480,309,22,'#684637');text('Я тебя люблю. ❤️',480,379,39,'#bf5665');text('Нажми, чтобы продолжить ♡',480,448,18,'#886e5a');return}if(mode==='ending'){bg('ending');rounded(260,345,440,132,18,'#241c1ab9','#f8d9aa66');text('Спасибо за это путешествие ♡',480,391,25);text('Made just for you · Нажми, чтобы начать снова',480,438,16);return}bg(backgrounds[stage]);const off=Math.sin(frame*.012)*3;ctx.fillStyle=stage===1?'#072b2c26':stage===3?'#c86b6422':'#fff3ce16';ctx.fillRect(0,0,W,H);for(const p of particles){ctx.globalAlpha=Math.min(.6,p.life/3);ctx.fillStyle=stage===1?'#fff8ad':'#fff1cf';ctx.beginPath();ctx.arc(p.x,p.y+off,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;const x=progress-cam;const marker=stage===0?650:stage===1?830:stage===2?850:1100;const mx=marker-cam;if(mx>-80&&mx<W+80){ctx.save();ctx.translate(mx,342);ctx.fillStyle='#f9e8c9';ctx.beginPath();ctx.arc(0,0,27+Math.sin(frame*.05)*2,0,7);ctx.fill();text(stage===0?'✉':stage===1?'🌸':stage===2?'♪':'💌',0,11,30,'#7d4b41');ctx.restore()}cat(x,410+y);rounded(14,13,260,47,12,'#302e2cc7','#fff4d16b');text((stage+1)+'. '+names[stage],28,44,22,'#fff4df','left');rounded(705,13,240,47,12,'#302e2cc7','#fff4d16b');text('♡ '+flowers+'/3  ·  ✉',825,44,22);if(Math.abs(progress-marker)<170){rounded(340,395,280,47,14,'#2b2925bb','#ffe6b877');text('Нажми ♡ для действия',480,426,21)}if(progress>stageLengths[stage]-230)text('Продолжай путь →',750,165,21);controls.style.display='block'}let previous=performance.now();function tick(now){let dt=Math.min(.04,(now-previous)/1000);previous=now;update(dt);render();requestAnimationFrame(tick)}requestAnimationFrame(tick);window.addEventListener('blur',()=>{held.left=false;held.right=false});})();
