<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#304e53"><title>Cat Delivery — A Little Letter ♡</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#273f47;color:#fff2dd;touch-action:none;-webkit-user-select:none;user-select:none}body{font-family:Georgia,serif}canvas{display:block;width:100%;height:100%;touch-action:none}#rotate{position:fixed;inset:0;background:linear-gradient(150deg,#294b52,#967c85);z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:16px;padding:30px;font-size:24px}#rotate .phone{font-size:70px}#controls{display:none;position:fixed;inset:0;pointer-events:none;z-index:4}button{font-family:inherit;cursor:pointer}#controls button{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:clamp(54px,10vh,76px);height:clamp(54px,10vh,76px);border-radius:50%;border:2px solid #fff5d9bb;color:#fff6e8;background:#233d44a3;box-shadow:0 3px 12px #13292d77;font:clamp(25px,5vh,38px) system-ui;pointer-events:auto;touch-action:none;backdrop-filter:blur(6px)}#left{left:max(18px,env(safe-area-inset-left))}#right{left:calc(max(18px,env(safe-area-inset-left)) + clamp(66px,12vh,88px))}#jump{right:max(18px,env(safe-area-inset-right))}#action{right:calc(max(18px,env(safe-area-inset-right)) + clamp(66px,12vh,88px))}#sound,#pause{position:fixed;top:max(12px,env(safe-area-inset-top));z-index:5;background:#263d42a8;color:#fff5df;border:1px solid #fff8d5aa;border-radius:50%;width:42px;height:42px;font-size:22px;display:none}#sound{right:max(15px,env(safe-area-inset-right))}#pause{right:calc(max(15px,env(safe-area-inset-right)) + 50px)}@media(orientation:portrait){#rotate{display:flex}#controls,#sound,#pause{display:none!important}}@media(max-height:360px){#controls button{width:52px;height:52px;font-size:26px}}
</style></head><body><canvas id="game" aria-label="Cat Delivery game"></canvas><div id="rotate"><div class="phone">📱 ↻</div><strong>Поверни телефон горизонтально</strong><small>Котик уже ждёт тебя ♡</small></div><div id="controls"><button id="left" aria-label="Идти влево">←</button><button id="right" aria-label="Идти вправо">→</button><button id="action" aria-label="Взаимодействовать">♡</button><button id="jump" aria-label="Прыжок">↑</button></div><button id="sound" aria-label="Звук">♫</button><button id="pause" aria-label="Пауза">Ⅱ</button><script src="game.js"></script></body></html>
